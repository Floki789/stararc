version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: stararc-postgres
    environment:
      POSTGRES_DB: stararc
      POSTGRES_USER: stararc_user
      POSTGRES_PASSWORD: stararc_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - stararc-network

  redis:
    image: redis:7-alpine
    container_name: stararc-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - stararc-network
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stararc-backend
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://stararc_user:stararc_password@postgres:5432/stararc
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - stararc-network
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stararc-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - stararc-network
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /app/src

volumes:
  postgres_data:
  redis_data:

networks:
  stararc-network:
    driver: bridge